{% set name = "assertpy" %}
{% set version = "2.35.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/assertpy-{{ version }}.tar.gz
  sha256: 84c6be9d69c053808ea8580c65f25ebb839a6a205668ec9de2d07683ce98c656

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - assertpy
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/assertpy/assertpy
  summary: Fluent, fully typed assertion library for Python
  license: BSD-3-Clause
  license_file: LICENSE
  doc_url: https://assertpy.github.io/assertpy/
  dev_url: https://github.com/assertpy/assertpy

extra:
  recipe-maintainers:
    - Solganis
    - dwyatte
    - saturnboy
