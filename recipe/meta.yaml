{% set name = "assertpy" %}
{% set version = "2.36.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/assertpy-{{ version }}.tar.gz
  sha256: 94856ca5ec7131e26584115bea06f85c10aacaa5f4c525254f32d6986edf9e0a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - assertpy
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/assertpy/assertpy
  summary: Fluent, fully typed assertion library for Python
  license: BSD-3-Clause
  license_file: LICENSE
  doc_url: https://assertpy.github.io/assertpy/
  dev_url: https://github.com/assertpy/assertpy

extra:
  recipe-maintainers:
    - Solganis
    - dwyatte
    - saturnboy
